<!DOCTYPE html>
<html lang="en">
<head>
  <!-- META -->
  <meta charset="utf-8" />
  <title>About Us | HITAC Adhesives &amp; Coatings</title>
  <meta name="description"
        content="About HITAC Adhesives & Coatings – facilities and manufacturing capabilities." />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, target-densitydpi=device-dpi" />

  <!-- CSS -->
  <link href="bootstrap.css" rel="stylesheet" type="text/css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="slicknav.css" rel="stylesheet" type="text/css" />

  <!-- GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css?family=Oswald:300,400,700&display=swap"
        rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,500,600,700&display=swap"
        rel="stylesheet" />

  <!-- (Optional) Google Analytics – copy your GA snippet here if you want tracking -->
</head>
<body>

  <!-- HEADER (loaded from header.html) -->
  <div id="header-placeholder"></div>

  <main class="about-page">
    <div class="about-inner">
      <h1 class="about-us-title">About Us</h1>

      <section class="about-gallery">
        <div class="about-gallery-inner">

          <div class="about-photo">
            <!-- update these src paths to match your real image files -->
            <img src="assets/about/about1.jpg"
                 alt="HITAC manufacturing reactors and process equipment" />
          </div>

          <div class="about-photo">
            <img src="assets/about/about2.jpg"
                 alt="HITAC coating and converting line" />
          </div>

          <div class="about-photo">
            <img src="assets/about/about3.jpg"
                 alt="HITAC packaging and production equipment" />
          </div>

        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER (loaded from footer.html) -->
  <div id="footer-placeholder"></div>

  <!-- Load shared header & footer -->
  <script>
    // Load header.html into the placeholder
    fetch('header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
      })
      .catch(err => console.error('Error loading header:', err));

    // Load footer.html into the placeholder
    fetch('footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      })
      .catch(err => console.error('Error loading footer:', err));
  </script>
</body>
</html>
