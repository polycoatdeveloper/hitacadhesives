<!DOCTYPE html>
<html lang="en">
<head>
  <!-- META -->
  <meta charset="utf-8" />
  <title>End Products | HITAC Adhesives &amp; Coatings</title>
  <meta name="description"
        content="End products manufactured using HITAC release agent technologies." />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, target-densitydpi=device-dpi" />

  <!-- CSS -->
  <link href="bootstrap.css" rel="stylesheet" type="text/css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="slicknav.css" rel="stylesheet" type="text/css" />

  <!-- GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css?family=Oswald:300,400,700&display=swap"
        rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,500,600,700&display=swap"
        rel="stylesheet" />

  <!-- (Optional) Google Analytics – copy your GA snippet here if you want tracking -->
</head>
<body>

  <!-- HEADER (loaded from header.html) -->
  <div id="header-placeholder"></div>

  <main class="endproducts-page">
    <div class="endproducts-inner">
      <h1 class="endproducts-title">End Products</h1>

      <section class="endproducts-gallery">
        <div class="endproducts-gallery-inner">

          <!-- Update these src paths / filenames to match your real images -->
          <div class="endproducts-photo">
            <img src="assets/end_products/endproduct1.jpg"
                 alt="Lab team working with adhesive products" />
          </div>

          <div class="endproducts-photo">
            <img src="assets/end_products/endproduct2.jpg"
                 alt="Colored tape rolls" />
          </div>

          <div class="endproducts-photo">
            <img src="assets/end_products/endproduct3.jpg"
                 alt="Filament tape end product" />
          </div>

        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER (loaded from footer.html) -->
  <div id="footer-placeholder"></div>

  <!-- Load shared header & footer -->
  <script>
    // Load header.html into the placeholder
    fetch('header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
      })
      .catch(err => console.error('Error loading header:', err));

    // Load footer.html into the placeholder
    fetch('footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      })
      .catch(err => console.error('Error loading footer:', err));
  </script>
</body>
</html>
