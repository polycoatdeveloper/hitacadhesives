<!DOCTYPE html>
<html lang="en">
<head>
  <!-- META -->
  <meta charset="utf-8" />
  <title>Production Capabilities | HITAC Adhesives &amp; Coatings</title>
  <meta name="description"
        content="Production capabilities and manufacturing at HITAC Adhesives & Coatings." />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, target-densitydpi=device-dpi" />

  <!-- CSS -->
  <link href="bootstrap.css" rel="stylesheet" type="text/css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="slicknav.css" rel="stylesheet" type="text/css" />

  <!-- GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css?family=Oswald:300,400,700&display=swap"
        rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,500,600,700&display=swap"
        rel="stylesheet" />
</head>
<body>

  <!-- HEADER (loaded from header.html) -->
  <div id="header-placeholder"></div>

  <main class="prodcap-page">
    <div class="prodcap-inner">
      <h1 class="prodcap-title">Production Capabilities</h1>

      <section class="prodcap-gallery">
        <div class="prodcap-gallery-inner">

          <!-- Update src paths/filenames to match your actual images -->
          <div class="prodcap-photo">
            <img src="assets/prod_cap/production1.jpg"
                 alt="Scientist planning production chemistry" />
          </div>

          <div class="prodcap-photo">
            <img src="assets/prod_cap/production2.jpg"
                 alt="HITAC reactors and production tanks" />
          </div>

          <div class="prodcap-photo">
            <img src="assets/prod_cap/production3.jpg"
                 alt="Automated production and packaging line" />
          </div>

        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER (loaded from footer.html) -->
  <div id="footer-placeholder"></div>

  <!-- Load shared header & footer -->
  <script>
    // Load header.html into the placeholder
    fetch('header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
      })
      .catch(err => console.error('Error loading header:', err));

    // Load footer.html into the placeholder
    fetch('footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      })
      .catch(err => console.error('Error loading footer:', err));
  </script>
</body>
</html>
