<!DOCTYPE html>
<html lang="en">
<head>
  <!-- META -->
  <meta charset="utf-8" />
  <title>Research &amp; Development | HITAC Adhesives &amp; Coatings</title>
  <meta name="description"
        content="Research and development at HITAC Adhesives & Coatings." />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, target-densitydpi=device-dpi" />

  <!-- CSS -->
  <link href="bootstrap.css" rel="stylesheet" type="text/css" />
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link href="slicknav.css" rel="stylesheet" type="text/css" />

  <!-- GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css?family=Oswald:300,400,700&display=swap"
        rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,500,600,700&display=swap"
        rel="stylesheet" />

  <!-- (Optional) Google Analytics – copy your GA snippet here if you want tracking -->
</head>
<body>

  <!-- HEADER (loaded from header.html) -->
  <div id="header-placeholder"></div>

  <main class="rnd-page">
    <div class="rnd-inner">
      <h1 class="rnd-title">Research &amp; Development</h1>

      <section class="rnd-gallery">
        <div class="rnd-gallery-inner">

          <!-- Update these src values to your actual image filenames -->
          <div class="rnd-photo">
            <img src="assets/rnd/rnd1.jpg"
                 alt="Scientific research illustration" />
          </div>

          <div class="rnd-photo">
            <img src="assets/rnd/rnd2.jpg"
                 alt="Team of scientists reviewing data" />
          </div>

          <div class="rnd-photo">
            <img src="assets/rnd/rnd3.jpg"
                 alt="Lab technician working with samples" />
          </div>

        </div>
      </section>
    </div>
  </main>

  <!-- FOOTER (loaded from footer.html) -->
  <div id="footer-placeholder"></div>

  <!-- Load shared header & footer -->
  <script>
    // Load header.html into the placeholder
    fetch('header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
      })
      .catch(err => console.error('Error loading header:', err));

    // Load footer.html into the placeholder
    fetch('footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      })
      .catch(err => console.error('Error loading footer:', err));
  </script>
</body>
</html>
